<style>

<script>
(()=>{
const SAMPLE=`# 墨枝用法
## 粘贴
- 页面任意位置按 **Ctrl V** 或 **⌘ V**
- 或点右上角「粘贴」
- 也可把 \`.md\` 文件拖进页面
## 层级
- 第一个 \`#\` 标题是中心主题
- \`##\` \`###\` 依次往下分级
- 列表按缩进继续分级
  - 缩进两格或四格都可以
    - 层级不限
- 有序列表保留编号
## 操作
- 拖动画布平移
- 滚轮或双指缩放
- 点击节点折叠或展开
- 按 F 适配视野
- 按 1 / 2 / 3 只看前几级，0 看全部
## 布局
- 双翼：一级分支分在左右两侧
- 右展：全部向右，适合长大纲
## 导出
- PNG 图片，两倍清晰度
- SVG 矢量，可继续编辑
## 行内样式
- **加粗**、*斜体*、~~删除线~~
- \`行内代码\`
- [链接](https://commonmark.org)
- [x] 已完成的任务
- [ ] 待办的任务`;

const SERIF='"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","Microsoft YaHei","PingFang SC",sans-serif';
const BRUSH='"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",serif';
const MONO='ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace';
const STY=[
  {fam:SERIF,size:22,weight:700,lh:1.4,max:460},
  {fam:SERIF,size:18,weight:600,lh:1.45,max:240},
  {fam:SERIF,size:16,weight:400,lh:1.5,max:260},
  {fam:SERIF,size:15,weight:400,lh:1.5,max:260}];
const sty=d=>STY[Math.min(d,3)];
const label=n=>n.depth>=3&&n.children.length>0;
const nst=n=>n.depth>=2&&n.children.length&&!n.light?{...sty(n.depth),weight:600}:sty(n.depth);
const BWS=[6,3.4,2.1,1.5,1.15]; const bw=d=>BWS[Math.min(d,4)];
const VG=d=>d===1?26:d===2?14:6;
const MINK=12/15;
const HG=d=>d===0?70:d===1?44:32;
const $=id=>document.getElementById(id);
const stage=$('stage'),vp=$('vp'),gB=$('gB'),gN=$('gN');
const f=v=>(Math.round(v*10)/10).toString();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- parse ---------- */
const INL=/`([^`]+)`|\*\*(.+?)\*\*|__(.+?)__|~~(.+?)~~|\*([^*\s][^*]*?)\*|!?\[([^\]]*)\]\(\s*([^)\s]+)[^)]*\)/g;
const unesc=s=>s.replace(/\\([\\`*_{}\[\]()#+\-.!~|>])/g,'$1');
function inline(s){
  const out=[];let last=0,m;INL.lastIndex=0;
  while((m=INL.exec(s))){
    if(m.index>last)out.push({t:unesc(s.slice(last,m.index))});
    if(m[1]!=null)out.push({t:m[1],code:1});
    else if(m[2]!=null||m[3]!=null)out.push({t:unesc(m[2]??m[3]),b:1});
    else if(m[4]!=null)out.push({t:unesc(m[4]),del:1});
    else if(m[5]!=null)out.push({t:unesc(m[5]),i:1});
    else{const ok=/^(https?:|mailto:)/i.test(m[7]);out.push({t:unesc(m[6]||m[7]),href:ok?m[7]:null,link:1});}
    last=INL.lastIndex;
  }
  if(last<s.length)out.push({t:unesc(s.slice(last))});
  return out.filter(x=>x.t);
}
function parse(src){
  let uid=0;
  const lines=src.replace(/\r\n?/g,'\n').split('\n');
  const top={rank:0,children:[]},st=[top];
  let inds=[],inFence=false,lastItem=null;
  const push=(rank,raw)=>{
    while(st.length>1&&st[st.length-1].rank>=rank)st.pop();
    const n={id:++uid,raw,rank,children:[],collapsed:false};
    st[st.length-1].children.push(n);st.push(n);return n;
  };
  for(let line of lines){
    line=line.replace(/\t/g,'    ');
    if(/^\s*(```|~~~)/.test(line)){inFence=!inFence;continue}
    if(inFence||!line.trim())continue;
    line=line.replace(/^(\s*>)+\s?/,m=>m.replace(/>/g,' ').replace(/\s$/,''));
    if(!line.trim())continue;
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(line))continue;
    if(/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line))continue;
    let m;
    if((m=line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/))){inds=[];lastItem=push(m[1].length,m[2]);continue}
    if((m=line.match(/^(\s*)([-*+]|\d{1,3}[.)])\s+(.*\S)\s*$/))){
      const ind=m[1].length;
      while(inds.length&&inds[inds.length-1]>ind)inds.pop();
      if(!inds.length||inds[inds.length-1]<ind)inds.push(ind);
      lastItem=push(7+inds.length-1,/\d/.test(m[2])?m[2].replace(')','.')+' '+m[3]:m[3]);continue;
    }
    const ind=line.match(/^\s*/)[0].length;
    if(lastItem&&inds.length&&ind>inds[inds.length-1]){lastItem.raw+=' '+line.trim();continue}
    inds=[];lastItem=push(7,line.trim().replace(/^\|\s*|\s*\|$/g,'').replace(/\s*\|\s*/g,' · '));
  }
  let root;
  if(!top.children.length)return null;
  if(top.children.length===1)root=top.children[0];
  else root={id:++uid,raw:'中心主题',children:top.children,collapsed:false};
  (function fin(n){
    let raw=n.raw.trim(),task=null,tm=raw.match(/^\[( |x|X)\]\s+/);
    if(tm){task=tm[1]!==' ';raw=raw.slice(tm[0].length)}
    n.segs=inline(raw);
    if(task!=null){n.segs.unshift({t:task?'☑ ':'☐ ',box:1});n.done=task}
    if(!n.segs.length)n.segs=[{t:' '}];
    n.plain=n.segs.map(s=>s.t).join('');
    n.children.forEach(fin);
  })(root);
  return root;
}

/* ---------- text measure ---------- */
const mctx=document.createElement('canvas').getContext('2d');
function fontOf(n,seg){
  const s=nst(n),size=seg.code?s.size*.86:s.size;
  const w=seg.b?700:s.weight;
  return `${seg.i?'italic ':''}${w} ${size}px ${seg.code?MONO:s.fam}`;
}
const CJKR='\\u2E80-\\u9FFF\\uF900-\\uFAFF\\u3000-\\u303F\\uFF00-\\uFFEF\\u3040-\\u30FF\\uAC00-\\uD7AF';
const TOK=new RegExp(`[${CJKR}]|[^\\s${CJKR}]+|\\s+`,'g');
const SOFT=/^[，、：；。！？,;:·\/|—–\-]$/;
const NOSTART=/^[，。、；：！？）」』”’》〉】,.;:!?)\]%]/;
function wrap(n){
  n.light=false;let s=nst(n);
  let lines=breakLines(n,s.max);
  if(n.depth>=2&&n.children.length&&lines.length>2){n.light=true;s=nst(n);lines=breakLines(n,s.max)}
  if(lines.length>1){
    const L=lines.length,tot=lines.reduce((a,l)=>a+l.w,0);let lo=tot/L,hi=s.max;
    for(let i=0;i<14&&hi-lo>1;i++){const mid=(lo+hi)/2;if(breakLines(n,mid).length<=L)hi=mid;else lo=mid}
    lines=breakLines(n,Math.ceil(hi)+1);
  }
  n.lines=lines;n.lh=s.size*s.lh;n.tw=Math.max(...lines.map(l=>l.w));n.th=lines.length*n.lh;
}
function breakLines(n,max){
  const toks=[];
  for(const seg of n.segs){
    mctx.font=fontOf(n,seg);
    for(const tok0 of seg.t.match(TOK)||[]){
      const sp0=/^\s/.test(tok0);
      const parts=(!sp0&&mctx.measureText(tok0).width>max)?[...tok0]:[tok0];
      for(const t of parts){const sp=/^\s+$/.test(t);toks.push({seg,t,w:mctx.measureText(t).width,sp,soft:sp||SOFT.test(t)})}
    }
  }
  const lines=[];let cur=[],w=0;
  const merge=arr=>{
    while(arr.length&&arr[arr.length-1].sp)arr.pop();
    while(arr.length&&arr[0].sp)arr.shift();
    const line={p:[],w:0};
    arr.forEach(k=>{const l=line.p[line.p.length-1];if(l&&l.seg===k.seg){l.t+=k.t;l.w+=k.w}else line.p.push({seg:k.seg,t:k.t,w:k.w});line.w+=k.w});
    return line;
  };
  for(const t of toks){
    if(t.sp&&!cur.length)continue;
    if(!t.sp&&cur.length&&w+t.w>max&&!NOSTART.test(t.t)){
      let cut=-1,left=w;
      for(let k=cur.length-1,steps=0;k>0&&steps<7;k--,steps++){left-=cur[k].w;if(cur[k-1].soft){if(left>=max*.55)cut=k;break}}
      if(cut>0){lines.push(merge(cur.slice(0,cut)));cur=cur.slice(cut);while(cur.length&&cur[0].sp)cur.shift();w=cur.reduce((a,k)=>a+k.w,0)}
      else{lines.push(merge(cur));cur=[];w=0}
    }
    cur.push(t);w+=t.w;
  }
  if(cur.length){const l=merge(cur);if(l.p.length)lines.push(l)}
  if(!lines.length)lines.push({p:[],w:0});
  return lines;
}

/* ---------- layout ---------- */
let MAP=null,MODE=store.get('mozhi.mode')==='right'?'right':'wings',VIS=[],BOUNDS=null,isSample=true,userMoved=false,fresh=true,prevVis=new Set();
const view={k:1,tx:0,ty:0};
function layout(){
  VIS=[];
  (function prep(n,d,col,par){

    if(d===0){n.w=n.tw+36;n.h=n.th+22}else{n.w=Math.max(n.tw,14);n.h=n.th+8}

  const span=n=>{

    if(n.kids.length){let t=n.cy-n.ks/2;n.kids.forEach(c=>{place(c,cols,t,side);t+=c.bh+VG(c.depth)})}
  };
  const columns=(c,x0)=>{
    const mw=[];(function w(n){if(n.kids.length){mw[n.depth]=Math.max(mw[n.depth]||0,n.w);n.kids.forEach(w)}})(c);

    return cols;
  };

  const kids=MAP.kids;kids.forEach(span);
  let cut=kids.length;

    const tot=kids.reduce((a,c)=>a+c.bh,0);let acc=0,bd=Infinity;

    x0=Math.min(x0,n.x-(n.side<0?e:0));x1=Math.max(x1,n.x+n.w+(n.side>0?e:0));y0=Math.min(y0,n.y-4);y1=Math.max(y1,n.y+n.h+4)});

}

/* ---------- theme ---------- */
let T={};
function hex(c){c=c.replace('#','');if(c.length===3)c=[...c].map(x=>x+x).join('');const n=parseInt(c,16);return[n>>16&255,n>>8&255,n&255]}

  T={paper:g('--paper'),paper2:g('--paper-2'),rule:g('--ink-3'),ink:g('--ink'),ink2:g('--ink-2'),ink3:g('--ink-3'),seal:g('--seal'),sealInk:g('--seal-ink'),pal:[0,1,2,3,4,5,6].map(i=>g('--b'+i))};
}
let grainCanvas=null;
function makeGrain(){

    x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+Math.cos(a+.5)*l/2,py+Math.sin(a+.5)*l/2,px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke()}

}
const colOf=n=>n.col<0?T.seal:T.pal[n.col];
function textCol(n,seg){
  if(n.depth===0)return T.ink;

  if(seg.link)return mix(colOf(n),T.ink,.15);

/* ---------- geometry ---------- */
function taper(x0,y0,x1,y1,w0,w1){
  const cx=x0+(x1-x0)*.5,N=26,L=[],R=[];

    const t=i/N,u=1-t;
    const x=u*u*u*x0+3*u*u*t*cx+3*u*t*t*cx+t*t*t*x1;
    const y=u*u*u*y0+3*u*u*t*y0+3*u*t*t*y1+t*t*t*y1;
    const dx=3*u*u*(cx-x0)+3*t*t*(x1-cx),dy=6*u*t*(y1-y0);
    const len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,w=(w0+(w1-w0)*Math.pow(t,.7))/2;
    L.push(f(x+nx*w)+','+f(y+ny*w));R.push(f(x-nx*w)+','+f(y-ny*w));
  }

}
function under(xa,y,xb,w0,w1){

}
function branchList(){
  const out=[];

    if(!c.parent)return;const p=c.parent,s=c.side;
    let sx,sy,w0;
    if(p.depth===0){sx=s*(p.w/2-4);sy=0;w0=bw(0)}
    else{sx=s>0?p.x+p.w:p.x;sy=p.by;w0=bw(p.depth)*.5}
    const ex=s>0?c.x:c.x+c.w,ey=c.by,w1=bw(c.depth);

const desc=n=>n.children.reduce((a,c)=>a+1+desc(c),0);

/* ---------- svg render ---------- */
function segAttrs(n,seg){

  if(seg.b)a+=` font-weight="700"`;
  if(seg.i)a+=` font-style="italic"`;
  if(seg.del)a+=` text-decoration="line-through"`;

}
function textSVG(n){

    l.p.map(p=>{const t=`<tspan${segAttrs(n,p.seg)}>${esc(p.t)}</tspan>`;return p.seg.href?`<a href="${esc(p.seg.href)}" target="_blank" rel="noopener">${t}</a>`:t}).join('')+`</text>`).join('');

}
function render(){

function apply(){

  $('zPct').textContent=Math.round(view.k*100)+'%';
}

/* ---------- view ---------- */
function fitTarget(){
  const W=innerWidth,H=innerHeight,top=$('stage').getBoundingClientRect().top;
  const hb=document.querySelector('.top').getBoundingClientRect().bottom+18;
  const fb=H-document.querySelector('.bottom').getBoundingClientRect().top+18;
  const aw=Math.max(120,W-64),ah=Math.max(120,H-hb-fb);
  const b=BOUNDS,k=Math.min(1.25,aw/b.w,ah/b.h);
  if(k<MINK){const r=MAP,lead=MODE==='right'||W<700;return{k:MINK,tx:lead?20-r.x*MINK:W/2-(r.x+r.w/2)*MINK,ty:hb+ah/2-(r.y+r.h/2)*MINK-top}}

/* ---------- load ---------- */
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2000)}
function countAll(n){return 1+desc(n)}
async function warmFonts(root){
  if(!document.fonts||!document.fonts.load)return;
  const all=[];(function w(n){all.push(n.plain);n.children.forEach(w)})(root);
  const txt=all.join('').slice(0,4000)+'☐☑';
  try{await Promise.race([Promise.all([
    document.fonts.load(`30px "Ma Shan Zheng"`,'墨枝'),document.fonts.load(`700 22px "Noto Serif SC"`,root.plain),
    document.fonts.load(`400 16px "Noto Serif SC"`,txt),
    document.fonts.load(`600 18px "Noto Serif SC"`,txt),
    document.fonts.load(`700 16px "Noto Serif SC"`,txt)]),new Promise(r=>setTimeout(r,2500))])}catch(e){}
}
function load(src,{sample=false,quiet=false}={}){

  MAP=root;isSample=sample;markLevel(0);userMoved=false;fresh=true;prevVis=new Set();
  $('sampleTag').hidden=!sample;document.querySelector('.hint').hidden=!sample;
  if(!sample)store.set('mozhi.md',src);

}

}

/* ---------- interaction ---------- */
const byId=id=>{let r=null;(function w(n){if(n.id===id)r=n;else n.children.some(c=>(w(c),r))})(MAP);return r};
function toggle(id){
  const n=byId(id);if(!n)return;
  if(n.depth===0){fit(true);return}
  if(!n.children.length)return;
  const bx=n.x*view.k+view.tx,by=n.y*view.k+view.ty;
  n.collapsed=!n.collapsed;markLevel(-1);layout();render();
  view.tx+=bx-(n.x*view.k+view.tx);view.ty+=by-(n.y*view.k+view.ty);apply();userMoved=true;
}
const pts=new Map();let drag=null,pinch=null,downNode=null,moved=false;
stage.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  cancelAnimationFrame(anim);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){drag={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty,id:e.pointerId};moved=false;const g=e.target.closest&&e.target.closest('.node');downNode=g?+g.dataset.id:null}

});
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size>=2){
    const [a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;

  }

  else{view.tx-=e.deltaX;view.ty-=e.deltaY;apply();userMoved=true}

const centerZoom=fct=>{cancelAnimationFrame(anim);zoomAt(innerWidth/2,innerHeight/2,fct)};

$('zPct').onclick=()=>fit(true);$('btnFit').onclick=()=>fit(true);

const PAD=56;

}
function exportPNG(){
  readTheme();const b=BOUNDS,W=b.w+PAD*2,H=b.h+PAD*2;
  const sc=Math.min(2,12000/Math.max(W,H));
  const c=document.createElement('canvas');c.width=Math.round(W*sc);c.height=Math.round(H*sc);
  const x=c.getContext('2d');
  x.fillStyle=T.paper;x.fillRect(0,0,c.width,c.height);
  if(grainCanvas){x.fillStyle=x.createPattern(grainCanvas,'repeat');x.fillRect(0,0,c.width,c.height)}
  x.scale(sc,sc);x.translate(PAD-b.x,PAD-b.y);
  branchList().forEach(o=>{x.globalAlpha=o.op;x.fillStyle=o.col;x.fill(new Path2D(o.d))});
  x.globalAlpha=1;
  [...VIS].reverse().forEach(n=>{
    if(n.depth===0){
      x.fillStyle=T.paper2;x.beginPath();x.roundRect?x.roundRect(n.x,n.y,n.w,n.h,2):x.rect(n.x,n.y,n.w,n.h);x.fill();
      x.strokeStyle=T.rule;x.globalAlpha=.45;x.lineWidth=1;x.stroke();x.globalAlpha=1;
    }
    const s=sty(n.depth);
    textLines(n).forEach(({x:lx,base,l})=>{
      let cx=lx;
      l.p.forEach(p=>{
        x.font=fontOf(n,p.seg);x.fillStyle=textCol(n,p.seg);x.textBaseline='alphabetic';x.fillText(p.t,cx,base);
        const w=x.measureText(p.t).width;
        if(p.seg.del){x.fillRect(cx,base-s.size*.3,w,1)}
        else if(p.seg.link){x.fillRect(cx,base+2,w,1)}
        cx+=w;
      });
    });
    if(n.depth>0&&n.collapsed&&n.children.length){
      const cx=n.side>0?n.x+n.w+13:n.x-13,cy=n.by;
      x.beginPath();x.arc(cx,cy,9.5,0,Math.PI*2);x.fillStyle=T.paper;x.fill();x.strokeStyle=colOf(n);x.lineWidth=1.4;x.stroke();
      x.fillStyle=mix(colOf(n),T.ink,.3);x.font=`600 10.5px ${SERIF}`;x.textAlign='center';x.fillText(String(desc(n)),cx,cy+3.6);x.textAlign='left';
    }
  });
  return new Promise(r=>c.toBlob(r,'image/png'));
}
$('btnSvg').onclick=()=>{if(MAP)save(fname('svg'),exportSVG())};
$('btnPng').onclick=async()=>{if(!MAP)return;const bl=await exportPNG();if(bl)save(fname('png'),bl);else toast('导出没有成功，请稍后再试')};
