<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>新手通行證诊断框架</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#F2F5F5;--surface:#FFFFFF;--ink:#151E1D;--ink-3:#7B8A88;--rule:#D5DEDD;--gap:#9E342C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C1312;--surface:#141D1C;--ink:#E6EEED;--ink-3:#7A8C8A;--rule:#283735;--gap:#E3776C}}
:root[data-theme="dark"]{--paper:#0C1312;--surface:#141D1C;--ink:#E6EEED;--ink-3:#7A8C8A;--rule:#283735;--gap:#E3776C}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);margin:0;
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:26px 20px 44px}
h1{font-family:"Noto Serif SC",Georgia,serif;font-size:19px;font-weight:700;margin:0 0 14px;
  padding-bottom:11px;border-bottom:2px solid var(--ink)}
figure{margin:0;background:var(--surface);border:1px solid var(--rule);padding:18px 16px;overflow-x:auto}
figure svg{display:block;width:100%;min-width:880px;height:auto;color:var(--ink)}
@media (max-width:620px){.wrap{padding:16px 12px 32px}}
</style>

<div class="wrap">
<h1>新手通行證重构 · 结论框架</h1>
<figure>
<svg viewBox="0 0 920 878" role="img" aria-label="通行證结论框架：先定考核购买还是留存；四个硬事实推出三条结论——购买端与留存端是两个问题、2.8%不是价格问题、一套押注1比1服务不了两端；归因为曝光、奖励设计、进度设计三类并各附证伪条件；两个数据缺口尚未补齐；竞品共同解法为短周期任务驱动；最终分优化与重构两条路。">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<g font-family="'Noto Sans SC',sans-serif">

<!-- 1 -->
<text x="16" y="10" font-size="10.5" fill="currentColor" opacity=".5" letter-spacing="1.4">1 · 先定一件事</text>
<rect x="16" y="18" width="888" height="50" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="6 4" opacity=".8"/>
<text x="34" y="40" font-size="13.5" font-weight="700" fill="currentColor">通行證考核购买，还是考核留存？</text>
<text x="34" y="59" font-size="11.5" fill="currentColor" opacity=".78">下面第 3 步会证明这是两个问题 —— 两端的杠杆完全不同，混在一个指标里，改哪边都看不出效果</text>
<line x1="460" y1="68" x2="460" y2="94" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>

<!-- 2 现状 -->
<text x="16" y="108" font-size="10.5" fill="currentColor" opacity=".5" letter-spacing="1.4">2 · 现状 —— 四个硬事实</text>
<g font-size="10.5">
<rect x="16" y="116" width="211" height="86" fill="none" stroke="currentColor" stroke-width="1.2"/>
<text x="28" y="136" font-size="12.5" font-weight="700" fill="currentColor">买家：5 天就走完了</text>
<text x="28" y="155" fill="currentColor" opacity=".78">D0 购买 36%，最快 D5 满级</text>
<text x="28" y="171" fill="currentColor" opacity=".78">满级率 74.7% · 中位 Lv100</text>
<text x="28" y="190" fill="currentColor" opacity=".95">之后 25 天经验不再累积</text>

<rect x="241" y="116" width="211" height="86" fill="none" stroke="currentColor" stroke-width="1.2"/>
<text x="253" y="136" font-size="12.5" font-weight="700" fill="currentColor">非买家：30 天走完 35%</text>
<text x="253" y="155" fill="currentColor" opacity=".78">中位 Lv33 · 满级率 3.9%</text>
<text x="253" y="171" fill="currentColor" opacity=".78">押注中位 19,885</text>
<text x="253" y="190" fill="currentColor" opacity=".95">65% 的等级奖励从未发出</text>

<rect x="466" y="116" width="211" height="86" fill="none" stroke="currentColor" stroke-width="1.2"/>
<text x="478" y="136" font-size="12.5" font-weight="700" fill="currentColor">价值 74%–98% 在卡上</text>
<text x="478" y="155" fill="currentColor" opacity=".78">老幣只有 NT$7.5 ／ 37.5</text>
<text x="478" y="171" fill="currentColor" opacity=".78">两轨卡面额 3,620 vs 11,646</text>
<text x="478" y="190" fill="#9E342C">卡核销率：一个数都没有</text>

<rect x="691" y="116" width="211" height="86" fill="none" stroke="currentColor" stroke-width="1.2"/>
<text x="703" y="136" font-size="12.5" font-weight="700" fill="currentColor">买在体验之前</text>
<text x="703" y="155" fill="currentColor" opacity=".78">72% 在 Lv0-5 就买了</text>
<text x="703" y="171" fill="currentColor" opacity=".78">64.3% 在 D0-D3</text>
<text x="703" y="190" fill="currentColor" opacity=".95">只有 15.3% 拿它当首充</text>
</g>
<g stroke="currentColor" stroke-width="1.2" opacity=".8">
<line x1="121" y1="202" x2="121" y2="218"/><line x1="346" y1="202" x2="346" y2="218"/>
<line x1="571" y1="202" x2="571" y2="218"/><line x1="796" y1="202" x2="796" y2="218"/>
<line x1="121" y1="218" x2="796" y2="218"/></g>
<line x1="460" y1="218" x2="460" y2="246" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>

<!-- 3 结论 -->
<text x="16" y="260" font-size="10.5" fill="currentColor" opacity=".5" letter-spacing="1.4">3 · 由此得到三条结论</text>
<g font-size="10.5">
<rect x="16" y="268" width="285" height="88" fill="none" stroke="currentColor" stroke-width="1.6"/>
<text x="30" y="289" font-size="12.5" font-weight="700" fill="currentColor">购买端与留存端是两个问题</text>
<text x="30" y="309" fill="currentColor" opacity=".78">买在体验之前 → 奖励和进度</text>
<text x="30" y="325" fill="currentColor" opacity=".78">怎么改，都改不到购买决策</text>
<text x="30" y="345" fill="currentColor" opacity=".95">两端必须分开考核</text>

<rect x="316" y="268" width="285" height="88" fill="none" stroke="currentColor" stroke-width="1.6"/>
<text x="330" y="289" font-size="12.5" font-weight="700" fill="currentColor">2.8% 不是价格问题</text>
<text x="330" y="309" fill="currentColor" opacity=".78">高级证增量 NT$108–953</text>
<text x="330" y="325" fill="currentColor" opacity=".78">＝ 售价的 109%–1,946%</text>
<text x="330" y="345" fill="currentColor" opacity=".95">同期储值回馈中位才 143%</text>

<rect x="616" y="268" width="286" height="88" fill="none" stroke="currentColor" stroke-width="1.6"/>
<text x="630" y="289" font-size="12.5" font-weight="700" fill="currentColor">一套「押注 1:1」服务不了两端</text>
<text x="630" y="309" fill="currentColor" opacity=".78">对买家 5 天封顶，对中位用户</text>
<text x="630" y="325" fill="currentColor" opacity=".78">30 天只走 35%</text>
<text x="630" y="345" fill="currentColor" opacity=".95">同一条曲线，两端同时失效</text>
</g>
<line x1="460" y1="356" x2="460" y2="386" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>

<!-- 4 归因 -->
<text x="16" y="400" font-size="10.5" fill="currentColor" opacity=".5" letter-spacing="1.4">4 · 归因（各带证伪条件）</text>
<g font-size="10.5">
<rect x="16" y="408" width="285" height="96" fill="none" stroke="currentColor" stroke-width="1.2"/>
<text x="30" y="429" font-size="12.5" font-weight="700" fill="currentColor">曝光 <tspan font-size="10.5" font-weight="400" opacity=".6">· 只作用于购买端</tspan></text>
<text x="30" y="449" fill="currentColor" opacity=".78">通行證无弹窗、无红点、无埋点</text>
<text x="30" y="465" fill="currentColor" opacity=".78">新手挑戰每次进大厅强制弹窗</text>
<text x="30" y="481" fill="currentColor" opacity=".95">抢的正是同一个前 7 天</text>
<text x="30" y="498" fill="currentColor" opacity=".55">证伪：打开率已高而购买率仍低</text>

<rect x="316" y="408" width="285" height="96" fill="none" stroke="currentColor" stroke-width="1.2"/>
<text x="330" y="429" font-size="12.5" font-weight="700" fill="currentColor">奖励设计 <tspan font-size="10.5" font-weight="400" opacity=".6">· 只作用于留存端</tspan></text>
<text x="330" y="449" fill="currentColor" opacity=".78">价值几乎全在卡上，而卡绑定</text>
<text x="330" y="465" fill="currentColor" opacity=".78">指定游戏、7／30 天有效期</text>
<text x="330" y="481" fill="currentColor" opacity=".95">要主动进卡包才用得到</text>
<text x="330" y="498" fill="currentColor" opacity=".55">证伪：卡核销率很高</text>

<rect x="616" y="408" width="286" height="96" fill="none" stroke="currentColor" stroke-width="1.2"/>
<text x="630" y="429" font-size="12.5" font-weight="700" fill="currentColor">进度设计 <tspan font-size="10.5" font-weight="400" opacity=".6">· 只作用于留存端</tspan></text>
<text x="630" y="449" fill="currentColor" opacity=".78">押注 1:1 自动结算，无每日闸门</text>
<text x="630" y="465" fill="currentColor" opacity=".78">Lv50 起才有 24–120h 领取限时</text>
<text x="630" y="481" fill="currentColor" opacity=".95">节奏只管住了前 5 天</text>
<text x="630" y="498" fill="currentColor" opacity=".55">证伪：满级时点集中在 D25-30</text>
</g>
<line x1="460" y1="504" x2="460" y2="532" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>

<!-- 5 缺口 -->
<rect x="16" y="534" width="888" height="70" fill="#9E342C" fill-opacity=".06" stroke="#9E342C" stroke-width="1.6"/>
<text x="34" y="556" font-size="13" font-weight="700" fill="#9E342C">两个数据是空的，所以「曝光」和「奖励」谁是主因，现在判不了</text>
<text x="34" y="576" font-size="11.5" fill="#9E342C">卡核销率：空 → 分不开「用不掉」和「不想要」　　页面打开数据：空 → 分不开「没看见」和「看见了不想点」</text>
<text x="34" y="595" font-size="11.5" fill="#9E342C" opacity=".8">加上「买家从购买到满级的天数分布」，三个取数现在就能发 —— 它们各自杀死上面一条归因</text>
<line x1="460" y1="604" x2="460" y2="630" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>
<text x="474" y="623" font-size="11" fill="currentColor" opacity=".8">补齐后才能选路</text>

<!-- 6 竞品 -->
<text x="16" y="644" font-size="10.5" fill="currentColor" opacity=".5" letter-spacing="1.4">5 · 竞品对照</text>
<rect x="16" y="652" width="888" height="62" fill="none" stroke="currentColor" stroke-width="1.2"/>
<text x="34" y="674" font-size="12" font-weight="700" fill="currentColor">5 家里只有 2 家有通行证</text>
<text x="34" y="694" font-size="10.5" fill="currentColor" opacity=".78">星城 50 级 · 豪神 20 级</text>
<text x="290" y="674" font-size="12" font-weight="700" fill="currentColor">共同解法</text>
<text x="290" y="694" font-size="10.5" fill="currentColor" opacity=".78">短周期 · 少层级 · 每日任务驱动 · 周期内可完成 · 非全员</text>
<text x="640" y="674" font-size="12" font-weight="700" fill="currentColor">没有一家按金额线性折算</text>
<text x="640" y="694" font-size="10.5" fill="currentColor" opacity=".78">豪神是回流定向，结构与新用户不同</text>
<line x1="460" y1="714" x2="460" y2="742" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)"/>

<!-- 7 两条路 -->
<text x="16" y="756" font-size="10.5" fill="currentColor" opacity=".5" letter-spacing="1.4">6 · 两条路</text>
<g font-size="10.5">
<rect x="16" y="764" width="434" height="102" fill="none" stroke="currentColor" stroke-width="1.6"/>
<text x="32" y="783" font-size="10" fill="currentColor" opacity=".6">条件：打开率低 且 核销率低 —— 是「没看见 / 用不掉」</text>
<text x="32" y="803" font-size="13" font-weight="700" fill="currentColor">优化 · 不动机制</text>
<text x="32" y="822" fill="currentColor" opacity=".78">红点与角标 · 奖励自动到账 · 卡的价值可视化与使用引导</text>
<text x="32" y="838" fill="currentColor" opacity=".78">定向弹窗：已付费未购证约 3,700 人，现在完全没被定向</text>
<text x="32" y="857" fill="currentColor" opacity=".55">代价：进度机制不变，买家 D5 之后仍然没有进度可走</text>

<rect x="468" y="764" width="434" height="102" fill="none" stroke="currentColor" stroke-width="1.6"/>
<text x="484" y="783" font-size="10" fill="currentColor" opacity=".6">条件：打开率已高 或 满级集中在前 5 天 —— 是机制本身</text>
<text x="484" y="803" font-size="13" font-weight="700" fill="currentColor">重构 · 动机制</text>
<text x="484" y="822" fill="currentColor" opacity=".78">进度来源改行为计数／每日任务 · 双轨差异化 · 周期与层级</text>
<text x="484" y="838" fill="currentColor" opacity=".78">卡从「附赠品」改成主奖励，价值前置且可见</text>
<text x="484" y="857" fill="currentColor" opacity=".55">代价：需开发，但平台已有每日任务框架，不是从零</text>
</g>

</g>
</svg>
</figure>
</div>

</body></html>
