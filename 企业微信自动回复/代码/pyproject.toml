[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autoreply"
version = "0.1.0"
description = "企业微信自动回复工具中和运行平台无关的部分（分类、测试集统计）"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
package = ["pyinstaller==6.22.3"]

[tool.setuptools]
packages = ["autoreply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
