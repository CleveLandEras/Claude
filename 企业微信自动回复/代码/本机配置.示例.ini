; 本机配置模板。把这个文件复制成同一目录下的「本机配置.ini」，再填下面的项。
; 本机配置.ini 里有密钥：已排除在 git 和源码包之外，不要发给别人。

[model]
; 必填。模型服务的接口密钥，在 DeepSeek 开放平台 platform.deepseek.com 创建，通常以 sk- 开头。
; 直接贴在等号后面，不加引号。
api_key =

; 接口地址。默认 DeepSeek，换别的 OpenAI 兼容服务商才改。要 https 开头。
base_url = https://api.deepseek.com

; 模型名。思考页的费用按 deepseek-flash 算；以服务商控制台列出的名字为准。
model = deepseek-flash

; 单条等待上限（秒）。超时的这条转二讲。
timeout_seconds = 10

[classify]
; 判成自动的把握度阈值，0～1。现在是没测过的保守值，有密钥后用 python3 -m autoreply.tune 定。
threshold = 0.95
