<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>两到四个字的名字</title>
<!--
  Dk 汇报简报模板（2026-10-10 改版：汇报不是文章）。复制整页，只替换 body 里的内容。
  组件：.kpi 数字卡（一般不超过 3 张；没有能说明结论的数字就不用）· .phase 时间线卡（red 否决 / blue 当前 / 默认灰）· .keep 标签清单 · .cause 原因卡 · table 短语表（.same 行标红）· .opt 选项卡（.rec 推荐）· .steps 编号短条目。组件按内容选，不必都用。
  规则：不写成段落，结构用版面表达；条目尽量短（一两行为宜，不是上限）；表格格子写短语。
-->
<style>
:root{--ground:#f3f2ef;--surface:#fff;--ink:#1b1d21;--ink-2:#4a4f56;--muted:#868b92;--line:#e2e0db;--accent:#9a6f24;
--red:#a8382b;--red-soft:#f7e6e2;--blue:#1f63a8;--blue-soft:#e4eef8;--gray:#6b7078;--gray-soft:#ecebe8;--green:#2f6b52;--green-soft:#e2efe8;
--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;--serif:"Songti SC","Noto Serif SC",Georgia,serif;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#131518;--surface:#1b1e22;--ink:#e9e8e4;--ink-2:#b9bdc2;--muted:#8a9098;--line:#2e3339;--accent:#d6ab5c;
--red:#e48e7f;--red-soft:#3a211c;--blue:#7ab0e0;--blue-soft:#1b2b3a;--gray:#9aa0a8;--gray-soft:#24282d;--green:#7dbb9c;--green-soft:#1c3128;}}
:root[data-theme="dark"]{--ground:#131518;--surface:#1b1e22;--ink:#e9e8e4;--ink-2:#b9bdc2;--muted:#8a9098;--line:#2e3339;--accent:#d6ab5c;
--red:#e48e7f;--red-soft:#3a211c;--blue:#7ab0e0;--blue-soft:#1b2b3a;--gray:#9aa0a8;--gray-soft:#24282d;--green:#7dbb9c;--green-soft:#1c3128;}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:48px 32px 96px}
.meta{font-size:12.5px;color:var(--muted);margin:0 0 10px}
h1{font-family:var(--serif);font-size:28px;line-height:1.35;margin:0 0 8px}
.sub{font-size:16px;color:var(--ink-2);margin:0 0 28px}
h2{font-family:var(--serif);font-size:20px;margin:48px 0 16px;display:flex;align-items:baseline;gap:12px}
h2 .no{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.kpi .n{font-size:38px;font-weight:700;line-height:1.1;color:var(--ink)}
.kpi .n small{font-size:16px;font-weight:600;margin-left:4px;color:var(--ink-2)}
.kpi .t{font-size:14.5px;color:var(--ink-2);margin-top:8px}
.kpi.red .n{color:var(--red)}
.phase{border-top:4px solid var(--gray)}
.phase.red{border-top-color:var(--red)} .phase.blue{border-top-color:var(--blue)}
.phase .d{font-size:13px;color:var(--muted);font-weight:600}
.phase .h{font-size:16.5px;font-weight:700;margin:4px 0 10px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;margin-bottom:12px}
.tag.red{background:var(--red-soft);color:var(--red)} .tag.blue{background:var(--blue-soft);color:var(--blue)} .tag.gray{background:var(--gray-soft);color:var(--gray)} .tag.green{background:var(--green-soft);color:var(--green)}
.kv{font-size:14px;color:var(--ink-2);margin:6px 0}
.kv b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.keep{display:flex;flex-wrap:wrap;gap:10px}
.keep span{background:var(--green-soft);color:var(--green);font-size:14.5px;font-weight:600;padding:8px 14px;border-radius:4px}
.cause .h{font-size:16.5px;font-weight:700;margin:0 0 6px}
.cause .l{font-size:14.5px;color:var(--ink-2);margin:0 0 12px}
.cause .e{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
table{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:14.5px}
th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--ground)}
tr:last-child td{border-bottom:none}
td.w{color:var(--ink)} td.r{color:var(--ink-2)} td.d{color:var(--muted);width:80px}
tr.same td.w{color:var(--red);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:1px}
.legend{font-size:13px;color:var(--muted);margin:10px 0 0}
.q{font-size:17px;font-weight:700;margin:0 0 14px}
.opt{position:relative}
.opt .h{font-size:16px;font-weight:700;margin:0 0 6px}
.opt .l{font-size:14.5px;color:var(--ink-2)}
.opt.rec{border:2px solid var(--blue)}
.opt .badge{position:absolute;top:-11px;right:16px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:3px}
.why{font-size:14.5px;color:var(--ink-2);margin:14px 0 0}
.why b{color:var(--ink)}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.steps div{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;font-size:14.5px;color:var(--ink-2)}
.steps div::before{content:counter(s);display:block;font-size:22px;font-weight:700;color:var(--accent);margin-bottom:4px}
.links{font-size:13px;color:var(--muted);margin-top:40px} a{color:var(--accent)}
</style></head><body><div class="wrap">

<p class="meta">主题 · YYYY-MM-DD · 依据与核实程度</p>

</div>

  <div class="card phase blue"><div class="d">日期</div><div class="h">名称</div><span class="tag blue">状态</span>
