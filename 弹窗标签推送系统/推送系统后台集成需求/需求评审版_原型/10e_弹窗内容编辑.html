<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>10e 编辑弹窗内容</title>
<link rel="stylesheet" href="_后台框.css">
<link rel="stylesheet" href="_弹窗.css">
</head>
<body>
<div class="shot bk" data-page="弹窗" data-crumb="首储礼包">
  <div class="eh"><h3>首储礼包 <span class="id">ID 101</span></h3><span class="pill on">上架</span><span class="sp"></span></div>
  <div class="ed">
    <div>
      <div class="sec">
        <div class="sh"><span class="n">1</span>名称</div>
        <span class="inp v" style="width:100%">首储礼包</span>
      </div>
      <div class="sec">
        <div class="sh"><span class="n">2</span>标记</div>
        <div class="cards"><div class="card on"><i class="rd"></i><div><b>储值</b></div></div><div class="card"><i class="rd"></i><div><b>活动</b></div></div></div>
      </div>
      <div class="sec">
        <div class="sh"><span class="n">3</span>弹窗形式</div>
        <div class="row"><span class="radio on"><i></i>活动本身</span><span class="radio"><i></i>活动广告页</span></div>
      </div>
      <div class="sec">
        <div class="sh"><span class="n">4</span>引用它的规则</div>
        <table class="rank">
          <tr><th>弹窗位置</th><th>弹窗规则</th><th>弹出次数</th><th class="r">排序</th></tr>
          <tr><td>大厅自动弹窗</td><td>银卡已首储</td><td>每天首次登录弹 1 次</td><td class="r">1</td></tr>
          <tr><td>大厅自动弹窗</td><td>普卡已首储</td><td>每周 2 次</td><td class="r">1</td></tr>
          <tr><td>破产</td><td>其余</td><td>每天首次登录弹 1 次</td><td class="r">1</td></tr>
        </table>
      </div>
    </div>
    <div>
      <div class="sum">
        <div class="h">这条内容</div>
        <div class="k2"><span>标记</span><b>储值</b></div>
        <div class="k2"><span>弹窗形式</span><b>活动本身</b></div>
        <div class="k2"><span>引用</span><b>3 条规则</b></div>
      </div>
    </div>
  </div>
  <div class="foot"><span class="sp"></span><span class="btno">取消</span><span class="btnp">保存</span></div>
</div>
<script src="_后台框.js"></script>
</body>
</html>
