<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>02 新建推播</title>
<link rel="stylesheet" href="../原型样式.css">
<style>
html,body{margin:0;padding:0;background:#fff}
body{font-family:"Inter","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.5}
.shot{background:#fff;overflow:hidden}
.shot .z{zoom:1.12}
.shot .win{padding:0;border:0;border-radius:0;background:#fff;box-shadow:none}
.shot .fig{width:auto;border:0;border-radius:0}
.tc{font-family:"Inter","Noto Sans CJK TC","PingFang TC",sans-serif}
.b2{display:flex;gap:18px;align-items:flex-start}
.b2 .lc{flex:none;width:330px}
.b2 .r{flex:1;min-width:0}
</style>
</head>
<body>
<div class="shot" style="width:980px"><div class="z"><div class="win"><div class="fig">
  <div class="sec" style="padding:14px 18px 16px">
    <div class="f"><label style="width:70px"><span class="rq">*</span>发送对象</label><span class="rad"><i></i>全部玩家（74,480 人）</span><span class="rad on"><i></i>标签群组</span><span class="rad"><i></i>名单</span></div>
    <div class="b2">
      <div class="lc">
        <div class="f"><label style="width:70px"><span class="rq">*</span>标签群组</label><span class="in" style="width:250px">潜在流失（两档）<span class="dn">⌃</span></span></div>
      </div>
      <div class="r">
        <div class="f" style="height:auto;align-items:flex-start;padding-top:2px"><label style="width:auto;padding-right:10px;line-height:22px;white-space:nowrap">排除群组</label><span style="display:flex;flex-wrap:wrap;gap:6px 0"><span class="tg nw">VIP 名单</span><span class="tg fix nw">黑名单</span><span class="tg fix nw">机器人与测试账号</span><span class="tg fix nw">敏感状态账号</span></span></div>
        <div class="estb" style="margin-top:10px;padding:10px 14px">
          <div class="l">预计人数<span class="mute" style="margin-left:8px">人数截至 10/12 15:25</span></div>
          <div class="ln"><span>群组人数</span><b>7,880 人</b></div>
          <div style="padding-left:12px;color:var(--mute);line-height:20px">排除 30：VIP 名单 12 · 黑名单 3 · 机器人与测试账号 7 · 敏感状态账号 8</div>
          <div class="ln"><span>受众（排除后）</span><b>7,850 人</b></div>
          <div style="padding-left:12px;color:var(--mute);line-height:20px">不能收到 3,540：没装 App 2,860 · 通知关闭 660 · 同一设备只发 1 条 20</div>
          <div class="ln big"><span style="white-space:nowrap">推播能收到</span><b style="text-align:right">4,310 人</b></div>
          <div class="ft">开始发送时按群组当时的名单发，人数以那一刻为准</div>
        </div>
      </div>
    </div>
  </div>
</div></div></div></div>
</body>
</html>
