<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>03 按行为</title>
<link rel="stylesheet" href="../原型样式.css">
<style>
html,body{margin:0;padding:0;background:#fff}
body{font-family:"Inter","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.5}
.shot{background:#fff;overflow:hidden}
.shot .z{zoom:1.12}
.shot .win{padding:0;border:0;border-radius:0;background:#fff;box-shadow:none}
.shot .fig{width:auto;border:0;border-radius:0}
.tc{font-family:"Inter","Noto Sans CJK TC","PingFang TC",sans-serif}
</style>
</head>
<body>
<div class="shot" style="width:1024px"><div class="z"><div class="win"><div class="fig">
  <div class="sec" style="padding:14px 18px 16px">
    <div style="display:flex;gap:28px;align-items:flex-start">
      <div style="flex:1;min-width:0">
        <div class="f"><label style="width:78px"><span class="rq">*</span>触发行为</label><span class="in" style="width:220px">限时加码礼包快到期<span class="dn">⌃</span></span></div>
        <div class="f"><label style="width:78px">触发条件</label>礼包剩余<span class="num">2</span>小时时发送</div>
        <div class="f" style="padding-left:78px"><span class="ck">✓</span>只发给尚未购买该礼包的玩家</div>
        <div class="f"><label style="width:78px">生效期间</label><span class="in" style="width:104px">2026-10-02</span><span style="margin:0 8px">至</span><span class="in ph" style="width:104px">结束（选填）</span><span class="mute" style="margin-left:8px">不填则长期运行</span></div>
        <div class="f"><label style="width:78px">提醒次数</label>每次触发最多提醒<span class="num">1</span>次，同一玩家两次提醒至少间隔<span class="num">24</span>小时</div>
        <div class="f"><label style="width:78px">勿扰时段</label>00:00–08:00　命中时<span class="in" style="margin-left:8px;width:110px">放弃发送<span class="dn">⌵</span></span></div>
        <div class="f"><label style="width:78px">玩家在线</label><span class="in" style="width:110px">照发<span class="dn">⌵</span></span><span class="mute" style="margin-left:8px">另一选项：不发（由游戏内承接）</span></div>
      </div>
      <div style="flex:none;width:340px">
        <div class="ddf" style="margin:0;width:340px">
          <div class="gh">玩家行为</div>
          <div class="on">限时加码礼包快到期<em>礼包剩余 N 小时</em></div>
          <div>玩家升级<em>可选升到等级 N</em></div>
          <div>完成任务<em>可指定任务</em></div>
          <div>通行证升级<em>可选等级不超过 N</em></div>
          <div>破产后未回到游戏<em>破产后 N 小时未再登录</em></div>
          <div class="gh">活动事件</div>
          <div>时间偏移<em>项目开始／结束前后 N 小时</em></div>
        </div>
      </div>
    </div>
  </div>
</div></div></div>
</body>
</html>
