<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>12 弹窗上限</title>
<link rel="stylesheet" href="../原型样式.css">
<style>
html,body{margin:0;padding:0;background:#fff}
body{font-family:"Inter","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.5}
.shot{background:#fff;overflow:hidden}
.shot .z{zoom:1.12}
.shot .win{padding:0;border:0;border-radius:0;background:#fff;box-shadow:none}
.shot .fig{width:auto;border:0;border-radius:0}
.tc{font-family:"Inter","Noto Sans CJK TC","PingFang TC",sans-serif}
</style>
</head>
<body>
<div class="shot" style="width:980px"><div class="z"><div class="win"><div class="fig">
  <div class="sec" style="padding:12px 18px 12px">
    <div class="sh">每人每天上限</div>
    <table class="tb" style="margin-top:2px">
      <colgroup><col style="width:190px"><col></colgroup>
      <tr><th>推送方式</th><th>每人每天上限</th></tr>
      <tr class="gh"><td colspan="2">游戏内推送<span class="s">两种各自计数</span></td></tr>
      <tr><td>大厅弹窗＋破产弹窗</td><td><span class="num" style="margin-left:0">8</span>个</td></tr>
      <tr><td>快显</td><td><span class="num" style="margin-left:0">3</span>次</td></tr>
    </table>
    <div class="f" style="color:var(--ink2);margin-top:6px">到上限后当天不再弹出或显示，不排队补发；次日 00:00（台湾时间）重新计数</div>
  </div>
  <div class="sec" style="padding:12px 18px 12px">
    <div class="sh" style="height:auto;min-height:22px;flex-wrap:wrap;row-gap:2px">游戏内：弹窗的次数、冷却时间和每人每天上限</div>
    <table class="tb" style="margin-top:2px">
      <colgroup><col style="width:150px"><col><col style="width:300px"></colgroup>
      <tr><th>设置</th><th>管什么</th><th>在哪设</th></tr>
      <tr><td>弹窗次数</td><td class="m">一个排序项对同一位玩家最多弹几次</td><td>弹窗规则编辑的排序项，沿用现行设置</td></tr>
      <tr><td>冷却时间</td><td class="m">一个排序项弹出后，隔多久才再弹给同一位玩家</td><td>同上</td></tr>
      <tr><td>每人每天上限</td><td class="m">大厅弹窗与破产弹窗合计，弹出 1 个计 1</td><td>本页（上表「游戏内推送」行）</td></tr>
    </table>
  </div>
  <div class="sec" style="padding:12px 18px 14px">
    <div class="sh">判断先后<span style="font-weight:400;font-size:13px;color:var(--ink2)">前一步拦下的，不再进入后一步</span></div>
    <div class="f" style="height:auto;padding:3px 0"><label style="width:84px;white-space:nowrap;text-align:left">游戏内弹窗</label><div class="steps" style="border:0;padding:0;font-size:13px">
      <span class="s">投放条件<em>弹窗规则编辑</em></span><span class="ar">›</span>
      <span class="s">排序项的弹窗次数与冷却时间</span><span class="ar">›</span>
      <span class="s">每人每天上限<em>超出的排序项被截掉</em></span>
    </div></div>
  </div>
</div></div></div></div>
</body>
</html>
