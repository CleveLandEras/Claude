<!doctype html>

<style>
html,body{margin:0;padding:0;background:#fff}
body{font-family:"Inter","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;line-height:1.5}
.shot .z{zoom:1.0}
.seg>span{white-space:nowrap}
.shot .win{padding:0;border:0;border-radius:0;background:#fff;box-shadow:none}
.shot .fig{width:auto;border:0;border-radius:0}
.cap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border:1px solid #E4E7ED;border-radius:4px;background:#FAFBFC;color:#606266}

.cap .sp{width:14px}
table.pl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.pl th{font-weight:600;color:#73767A;background:#FAFBFC;text-align:left;padding:6px 6px;border-bottom:1px solid #EBEEF5;white-space:nowrap}
table.pl td{padding:6px 6px;border-bottom:1px solid #EBEEF5;color:#303133;vertical-align:top}
table.pl .r{text-align:right;font-variant-numeric:tabular-nums}
table.pl .s2{display:block;font-size:12px;color:#909399;line-height:17px}
table.pl .ac{color:#409EFF;white-space:nowrap}
table.pl td.nw{white-space:nowrap}
table.pl .w{font-weight:600;font-size:14px}
.st{display:inline-block;padding:0 6px;border:1px solid #C2E7B0;background:#F0F9EB;color:#529B2E;border-radius:3px;font-size:12px}
.mvn{display:flex;align-items:center;gap:10px;padding:7px 12px;margin-bottom:10px;border:1px solid #B3D8FF;border-radius:4px;background:#ECF5FF;color:#606266}
.mvn b{color:#2F6FCC;font-weight:600}
.fade{height:40px;margin-top:-40px;position:relative;background:linear-gradient(rgba(255,255,255,0),#fff)}
</style>
</head>

<div class="shot bk" data-page="弹窗" data-tabs="*大厅弹窗顺序设定|操作纪录" data-subnav="*弹窗顺序设定|玩家弹窗顺序查询" data-open="all"><div class="z"><div class="win"><div class="fig ew">

</div></div></div></div>
