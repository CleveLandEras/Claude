# 弹窗内容：每个活动存一份设置，在规则里配完

- 结论
  - 宣传图和跳转页面
    - 每个活动或礼包存一份，在后台更换（宣传图默认用活动或礼包自带的，可上传替换）
    - 不在规则里另设
  - 点击后是否跳转（是／否，选是才填跳转页面）、弹出时机、次数（每天几次、两次至少隔多久，后者默认不设）
    - 按活动存一份默认值，在规则里第一次加这个活动时配，别的规则选它时自动带出
  - 某群人要不同的是否跳转、弹出时机或次数（每天几次、两次至少隔多久）
    - 在这条规则里另设，只在这条规则里生效
    - 没另设的沿用活动上的设置
    - 改默认值时提示另有几条规则在用
  - 不单独建一页「弹窗内容」
    - 不用先去别处建好再回规则里选
  - 「在所有规则里暂停」开关
    - 每个活动或礼包的弹窗设置里都有，默认关
    - 打开时弹确认框，列出在用的规则
    - 只停弹窗，活动照常
    - 补的是不单独建弹窗内容后少掉的「一键下架、所有规则跳过它」
  - 间隔
    - 每个场景设「弹出间隔：每人同一场景，弹完到下次再弹至少隔多久」，可设例外（如破产礼包）
    - 同一个活动两次之间也可设至少隔多久，默认不设，只在弹出间隔更短、或这个活动不受弹出间隔时才用得上
    - 不设规则整体冷却
- 新建弹窗内容有什么意义
  - 不用单独建一页；按活动存一份，有两点用处
  - 图能在后台换
    - 现在写死在客户端的要开单、发版才能换，9 月已有工单提过（RICH-24469）
    - 弹出的是宣传图，默认用活动或礼包自带的，可上传替换
  - 同一批活动会出现在好几条按人群拆开的规则里，配一次各条规则共用
    - 弹窗按人群分时，活动类要拆成新增、回流、潜在流失、其余 4 条规则，各条排的是同一批活动
    - 运营同事的规则草稿
      - 14 个活动和礼包在 13 条有内容的规则里出现 43 次，同一个最多 5 条
      - 其中三档卡别的规则逐格相同
  - 运营草稿里，出现在 2 条以上规则的 11 个活动，弹窗设置除了次数在各条规则里都一样，所以按活动存默认值
- 为什么把规则和这份设置分开
  - 规则管给谁、在哪个场景、弹哪几个、什么顺序
    - 跟着人群变
  - 活动的弹窗设置管长什么样、点了去哪、弹出时机、默认弹几次
    - 跟着活动走
  - 两者都在规则这一页配完
- 间隔和次数为什么这样设
  - 运营草稿有一条总规则
    - 「弹出间隔 1800 秒（30 分钟），破产礼包、发财金除外」
    - 对应「每人同一场景，弹完到下次再弹至少隔多久」
  - 运营草稿里，同一个活动的间隔总跟次数一起写（如「每日 2 次，间隔 15 分钟」），所以并进次数；弹出间隔已经管住时，它不起作用
  - 「刚弹完又弹」由弹出间隔管；「一天被几条规则各弹一遍」由每天几次按活动跨规则合计管
  - 不设规则整体冷却
    - 大厅轮流弹时（玩家同时符合几条规则，每次进大厅轮到下一条），一条规则的冷却挡不住下一条规则
    - 只用优先级最高的一条时，它和弹出间隔作用重复
- 业界怎么做
  - Google Ad Manager（广告投放）
    - 素材存一份，投放计划里当场新建或从素材库选
    - 改素材，所有用它的投放计划一起变
  - Metaplay、Balancy（游戏运营后台）
    - 商品或 offer 单独存，排期、冷却设在投放规则上
  - Braze、OneSignal 等营销弹窗
    - 一条消息自带内容，复用靠复制
  - 和业界不同的两处
    - 弹出时机放在活动上
      - Metaplay 一组商品共用一个排期
      - 我们同一条规则里各项弹出时机不同，而同一个活动在各条规则里弹出时机一样
    - 每天几次按活动跨规则合计
      - 一个玩家可能轮到几条规则，按活动合计才不会一天被各弹一遍
      - Metaplay 商品上也有跨投放合计的每人上限
- 要注意的
  - 共用多少，取决于按人群拆规则的计划上线多少条；现在线上只有 3 条规则。规则少时，它就等于在规则里逐项填，不多一步
  - 后台配图要改客户端，按弹窗下发的图显示，原先评为较大开发，研发在评估
