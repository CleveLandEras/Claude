<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>推送管理后台</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;color:#606266;font-size:15px}
.page{border:1px solid #dcdfe6;padding:18px 22px 24px}
.top{display:flex;align-items:center;gap:12px;border-bottom:1px solid #e4e7ed;padding-bottom:14px;margin-bottom:18px}
.top .ttl{font-size:18px;font-weight:700;color:#303133}
.top .crumb{font-size:14px;color:#909399;margin-left:6px}
.pill{display:inline-flex;align-items:center;background:#2b5ea8;color:#fff;font-size:13px;font-weight:700;padding:3px 9px;border-radius:4px;line-height:1.3;white-space:nowrap}
.cols{display:flex;flex-direction:column;gap:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.card{border:1px solid #ebeef5;border-radius:4px;background:#fff}
.card .hd{padding:12px 18px;border-bottom:1px solid #ebeef5;font-size:16px;font-weight:700;color:#303133;background:#f5f7fa;display:flex;justify-content:space-between;align-items:center}
.card .bd{padding:18px 18px 8px}
.row{display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:start;margin-bottom:16px}
.row>label{text-align:right;color:#303133;font-size:15px;line-height:36px;white-space:nowrap}
.row>label i{color:#f56c6c;font-style:normal;margin-right:3px}
.ipt{height:36px;border:1px solid #dcdfe6;border-radius:4px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;color:#303133;font-size:14.5px;background:#fff}
.chev{display:inline-block;width:7px;height:7px;border-right:1.5px solid #a8abb2;border-bottom:1.5px solid #a8abb2;transform:rotate(45deg);margin:-4px 2px 0 8px}
.ta{border:1px solid #dcdfe6;border-radius:4px;padding:8px 12px;height:64px;color:#303133;font-size:14.5px;position:relative;line-height:1.5}
.ta small{position:absolute;right:10px;bottom:6px;color:#909399;font-size:12.5px}
.checks{display:flex;flex-wrap:wrap;gap:8px 20px;line-height:36px;color:#606266}
.ck{display:inline-flex;align-items:center;gap:7px;font-size:15px}
.ck b{width:16px;height:16px;border:1px solid #dcdfe6;border-radius:3px;background:#fff;position:relative;display:inline-block}
.ck.on{color:#409eff}
.ck.on b{background:#409eff;border-color:#409eff}
.ck.on b::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.rd{display:inline-flex;align-items:center;gap:7px;font-size:15px;color:#606266;width:84px;flex:none}
.rd b{width:16px;height:16px;border:1px solid #dcdfe6;border-radius:50%;background:#fff;position:relative;display:inline-block}
.rd.on{color:#409eff}
.rd.on b{border-color:#409eff;background:#409eff}
.rd.on b::after{content:"";position:absolute;left:4px;top:4px;width:6px;height:6px;border-radius:50%;background:#fff}
.trg{display:flex;flex-direction:column;gap:10px}
.trg .ln{display:flex;align-items:center;gap:10px}
.cb{display:inline-flex;border:1px solid #dcdfe6;border-radius:4px;overflow:hidden}
.cb span{padding:0 13px;height:34px;display:flex;align-items:center;font-size:14.5px;color:#606266;background:#fff}
.cb span+span{border-left:1px solid #dcdfe6}
.img{display:flex;align-items:center;gap:14px}
.img .th{width:88px;height:56px;border-radius:4px;background:linear-gradient(135deg,#8fa7e6,#4f69c6);position:relative;overflow:hidden}
.img .th::before{content:"";position:absolute;left:12px;bottom:-10px;width:40px;height:34px;background:rgba(255,255,255,.35);transform:rotate(45deg)}
.img .th::after{content:"";position:absolute;right:14px;top:10px;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.7)}
.link{color:#409eff;font-size:14.5px}
.lim{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid #ebeef5;border-radius:4px;overflow:hidden}
.lim span{display:flex;align-items:center;justify-content:center;height:34px;font-size:14px;color:#909399;background:#f5f7fa;border-bottom:1px solid #ebeef5}
.lim b{display:flex;align-items:center;justify-content:center;height:44px;font-weight:400}
.lim b i{font-style:normal;width:62px;height:30px;border:1px solid #dcdfe6;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#303133;font-size:14.5px}
.btns{display:flex;gap:10px;padding:4px 0 10px 112px}
.btn{height:36px;padding:0 20px;border-radius:4px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center}
.btn.blue{background:#409eff;color:#fff}.btn.plain{border:1px solid #dcdfe6;color:#606266;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{background:#f5f7fa;color:#909399;font-weight:600;height:44px;border-bottom:1px solid #ebeef5;text-align:left;padding:0 10px;white-space:nowrap}
td{border-bottom:1px solid #ebeef5;padding:12px 10px;color:#606266;white-space:nowrap}
th.n,td.n{text-align:right}
.rec .bd{padding:0}
.rec .ft{padding:12px 14px;font-size:13.5px;color:#909399}
.sub{font-size:13.5px;color:#909399;font-weight:400}
</style></head><body>
<div class="page">
  <div class="top"><span class="pill">新建</span><span class="ttl">推送管理</span></div>
  <div class="cols">
    <div class="card">
      <div class="hd">新建推送</div>
      <div class="bd"><div class="fgrid">
      <div>
        <div class="row"><label><i>*</i>推送名称</label><div class="ipt">回流任务开启</div></div>
        <div class="row"><label><i>*</i>推送方式</label><div class="checks">
          <span class="ck"><b></b>快显</span><span class="ck on"><b></b>推播</span><span class="ck on"><b></b>短信</span><span class="ck"><b></b>Facebook</span><span class="ck on"><b></b>LINE</span></div></div>
        <div class="row"><label><i>*</i>发送对象</label><div class="ipt">标签群组：回流<i class="chev"></i></div></div>
        <div class="row"><label><i>*</i>点击跳转</label><div class="ipt">活动页面：回流任务<i class="chev"></i></div></div>
        <div class="row"><label><i>*</i>触发条件</label><div class="trg">
          <div class="ln"><span class="rd on"><b></b>定时</span><div class="ipt" style="width:220px">2026-10-15 20:00</div></div>
          <div class="ln"><span class="rd"><b></b>按行为</span><div class="cb"><span>升级</span><span>任务完成</span><span>礼包将到期</span></div></div>
        </div></div>
      </div>
      <div>
        <div class="row"><label><i>*</i>文案</label><div class="ta">回流任务已开启，完成任务领取奖励<small>16/60</small></div></div>
        <div class="row"><label>图片</label><div class="img"><div class="th"></div><span class="link">更换图片</span></div></div>
        <div class="row"><label>每人每日上限</label><div class="lim"><span>快显</span><span>推播</span><span>短信</span><span>Facebook</span><span>LINE</span><b><i>3 次</i></b><b><i>2 次</i></b><b><i>1 次</i></b><b><i>1 次</i></b><b><i>1 次</i></b></div></div>
        <div class="btns"><span class="btn blue">保存</span><span class="btn plain">取消</span></div>
      </div>
      </div></div>
    </div>
    <div class="card rec">
      <div class="hd">发送记录</div>
      <div class="bd">
        <table>
          <colgroup><col style="width:26%"><col style="width:13%"><col style="width:13%"><col style="width:16%"><col style="width:16%"><col style="width:16%"></colgroup>
          <thead><tr><th>推送名称</th><th>方式</th><th>对象</th><th class="n">发送量</th><th class="n">到达</th><th class="n">点击</th></tr></thead>
          <tbody>
            <tr><td>回流任务开启</td><td>推播</td><td>回流</td><td class="n">—</td><td class="n">—</td><td class="n">—</td></tr>
            <tr><td>回流任务开启</td><td>LINE</td><td>回流</td><td class="n">—</td><td class="n">—</td><td class="n">—</td></tr>
            <tr><td>首储礼包提醒</td><td>快显</td><td>新增</td><td class="n">—</td><td class="n">—</td><td class="n">—</td></tr>
          </tbody>
        </table>
        <div class="ft">上线后按方式、按人群统计</div>
      </div>
    </div>
  </div>
</div>
</body></html>
