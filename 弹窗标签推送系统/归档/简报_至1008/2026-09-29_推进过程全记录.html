, "res": "无回溯、无方向变更（方向预警从「弹窗还是推送」拆成两问）。请 Dk 如知道「高卡现在有没有专人或客服维护」告诉一句。流程：本轮误把结束脚本提前运行了一次，锁提前释放，计划内容未受影响", "f": [], "idle": false, "wait": false, "n": 150}, {"t": "09-28 20:0x", "w": "设计者", "wr": "设计者", "s": 2, "lab": "环节2 问题诊断", "what": "写了 Q64（新增只来当天）、Q65（回流又走）、Q14（首储与储值位）三张设计卡，执行者可以接着做；推送 Q66 下一轮写", "why": "这三项都容易把「有差别」读成「是原因」：新增回来过的人押注、赠点当然更多；回流本来就是离开过的人；「付过费没买首储」能算出的人其实是小额玩家。方法和判读得在看到结果之前定死", "res": "① 新增：只允许拿注册前就定下来的因素（注册日期、时段、平台）去比。试算发现按日历日算「只来当天」，晚上注册的人会少算约 10 个百分点，其实是玩过零点被算成「回来过」，所以按时段比较改用「注册后 24 小时」口径。这一项最多能说明人在第一天的哪一段走掉，说明不了是不是弹窗造成的。建议给你加一件自查 ⑤：用新注册账号在 App、网页各进一次大厅，记下依次弹出的弹窗。② 回流：和同卡别、同注册时长、同付费状态的持續用户比，算「超出正常水平」的人数。但回流本来就是离开过的人，差异不能归因到「没有回流规则」。③ 首储：找到一个新下界。充值赠点只增不减，所以赠点不到 15,000 的付费者一定没买过首储，试算约 3,677 人，但几乎全是储值中位 50 元的普卡，NT$50 对他们价位合适，<b>不能当作「高卡被首储占位」的规模</b>；高卡那一侧仍然只有上界。规划者问的「最近来过的 2 万名从未储值者，排第一档是问题大还是口径宽」，按注册时长拆开回答：试算约六成是注册一年以上的老账号，长期在首储面前仍没付费，「潜在付费靠首储覆盖」对他们可能等于维持现状（推断）", "f": [], "idle": false, "wait": false, "n": 151}, {"t": "09-28 20:0x", "w": "规划者", "wr": "规划者", "s": 2, "lab": "环节2 问题诊断", "what": "把执行者刚做完的标签诊断记为完成；三张新卡定了执行顺序：高卡 → 首储 → 回流 → 新增 → 推送；采纳设计者的建议，给你加自查 ⑤（用新注册账号在 App、网页各进一次大厅，记下依次弹出的弹窗）；把弹窗疲劳和月月抽、破产位排进队列，让设计者提前写卡", "why": "标签诊断的结论是缺定义、不缺能力（6 个人群里 5 个缺定义、0 个缺能力）；原来的「交集」其实是「同一人同时符合两条弹窗规则谁先弹」，归到弹窗疲劳。首储提前，因为「从未储值、最近来过的 2 万人」是第一档里口径最宽、最可能掉档的一项", "res": "无回溯、无方向变更。标签线落地的关键变成「谁能在后台写 SQL 建标签」，可能要找主管要人。回流「超出同条件用户多少」只作为旁注，不改排序规则，全部诊断做完重排时再议", "f": [], "idle": false, "wait": false, "n": 152}, {"t": "09-28 20:1x", "w": "设计者", "wr": "设计者", "s": 2, "lab": "环节2 问题诊断", "what": "写了 Q66（推送诊断）设计卡，执行者排在高卡、首储、回流、新增之后做；弹窗疲劳、月月抽、破产位（Q68、Q69）是本轮写卡期间才排进来的，下一轮写", "why": "推送这一项最容易出两种错：把「4 万人、9% 储值」当成推送的分量（其实约八成的钱就是那 927 名高卡），以及把「不知道能不能定向」写成「不能定向」。这决定 07 统一推送后台的理由是「为了钱」还是「为了人数」、第一期先做什么", "res": "① <b>试算有新发现</b>：那 2.7 万名「独有」的沉默者里，约 7,200 人（四分之一多）是 8 月才注册的新人，其中 2,407 人就是「注册当天之后再没来」的那批——他们是新人留存问题，不是老用户沉默，卡上要求拆出来。② 剩下约 1.96 万个老账号，按「累计押注是否不低于仍在来的普卡的中位数」分段；判读规则事先定死：有 5,000 人以上且占三成以上，才能说「普卡召回有具体对象」。③ 四项推送能力里，「快显写死」「通行证推送不跳转」只对在线的人起作用，按机制卡不住已经不来的人，应归到新人第一天和弹窗疲劳。④ 「沉默的人本来就召不回」<b>本地
